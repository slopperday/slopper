# Releases for slopper.day, planned by monochange (https://github.com/monochange/monochange).
# The CLI is pinned in devDependencies: run it as `vp exec monochange`, not a
# global install, which may be older.
#
# Every change that should be released gets a changeset in .changeset/. The
# type picks the audience:
#
#   vp exec monochange create --package slopper --type user_feat --reason "Pin your best slop" --output .changeset/pin-slops.md
#   vp exec monochange create --package slopper --type fix --reason "Retry B2 uploads once" --output .changeset/retry-b2.md
#
# User types (user_feat, user_fix, user_change, user_breaking) become the release notes on
# slopper.day/changelog. Everything else (feat, fix, major, minor, patch, docs,
# refactor, test, none, ...) goes to CHANGELOG.md for developers. A change that
# matters to both audiences gets one changeset for each.
#
# The agent CLI (@slopperday/cli) and its skill (@slopperday/skill) release
# together as the `cli` group. They're public on npm but not open source
# (UNLICENSED). Their changesets name the group: `--package cli --type feat`.
#
# A release is a pull request (scripts/release.ts has the details):
#
#   vp exec monochange run release --dry-run   # preview the next release
#   vp exec monochange run release             # from main: commit the release on chore/release and open its pull request
#
# The release pull request merges itself once its required check reports
# (.github/workflows/release-merge.yml), which runs .github/workflows/release.yml
# on main: `monochange run publish` tags the release, deploys Convex and Netlify
# when the site is in it, and publishes the released npm packages with trusted
# publishing. Merging a release pull request by hand publishes the same way.
# A new npm package needs `vp exec monochange publish placeholder` once, from
# this machine, and then `npm trust github <package> --file release.yml
# --repository ifiokjr/slopper` before its first release.

[defaults]
# The app is a private package; release it anyway.
include_private = true

[package.slopper]
path = "."
type = "npm"
# Tags are plain v1.2.3; this is the only release owner.
tag = true
version_format = "primary"
# Netlify ships the site (scripts/release.ts); nothing goes to npm.
publish = { enabled = false }
changelog = { path = "CHANGELOG.md", format = "keep_a_changelog" }
# The website reads the date back out of this title (app/.server/changelog.ts).
changelog_version_title = "{{ version }} ({{ date }})"

[package."@slopperday/cli"]
path = "packages/cli"
type = "npm"

[package."@slopperday/skill"]
path = "packages/skill"
type = "npm"

# The skill documents the CLI, so they share a version: tags are cli/v1.2.3.
[group.cli]
packages = ["@slopperday/cli", "@slopperday/skill"]
tag = true
changelog = { path = "packages/cli/CHANGELOG.md", format = "keep_a_changelog" }

[ecosystems.npm]
# monochange can't parse pnpm 12's two-document pnpm-lock.yaml yet, so let
# pnpm refresh it. The root version isn't in the lockfile, so this is a no-op.
lockfile_commands = [{ command = "pnpm install --lockfile-only" }]

[ecosystems.npm.publish]
# Only the release workflow publishes, with npm trusted publishing (OIDC); a
# local publish fails. The repo is private, so npm adds no provenance. In this
# mode monochange runs `npm publish`, which doesn't rewrite `workspace:`
# ranges, so a published package must not depend on one.
enabled = true
mode = "builtin"
registry = "npm"

[ecosystems.npm.publish.trusted_publishing]
repository = "ifiokjr/slopper"
workflow = "release.yml"

[changelog.streams.user]
description = "What people using slopper.day notice: new things to do, fixes they'd feel, changes they need to act on. Deployment, CI, tooling, tests and refactors stay in the default stream."

[changelog.types]
user_feat = { bump = "minor", section = "user_new", stream = "user", description = "Something new people can do on slopper.day" }
user_fix = { bump = "patch", section = "user_fixed", stream = "user", description = "Something that now works the way people expect" }
user_change = { bump = "minor", section = "user_changed", stream = "user", description = "Something that works differently now, with nothing for people to do" }
# Only for changes people must act on: it bumps the site's major version.
user_breaking = { bump = "major", section = "user_breaking", stream = "user", description = "A change people have to act on, such as signing in again" }

[changelog.sections]
user_breaking = { heading = "Action needed", priority = 5 }
user_changed = { heading = "Changed", priority = 10 }
user_new = { heading = "New", priority = 20 }
user_fixed = { heading = "Fixed", priority = 30 }

# One JSON file per release, bundled into the site and shown at /changelog.
[changelog.outputs.user]
stream = "user"
targets = ["slopper"]
path = "app/changelog/{{ version }}.json"
format = "json"
mode = "release"

[cli.release]
help_text = "Release from a clean main: commit the version bumps and changelogs on chore/release, push it and open its pull request. Merging it publishes."
inputs = [{ name = "format", type = "choice", choices = ["text", "markdown", "json"], default = "text" }]

[[cli.release.steps]]
type = "Command"
name = "start the release branch"
command = "node scripts/release.ts branch"
dry_run_command = "node scripts/release.ts branch --dry-run"

[[cli.release.steps]]
type = "PrepareRelease"
name = "plan release"
inputs = ["format"]

[[cli.release.steps]]
type = "CommitRelease"
name = "commit release"
# A dry run writes no release record, so there's nothing to commit.
when = "{{ number_of_changesets > 0 && not release.dry_run }}"

[[cli.release.steps]]
type = "Command"
name = "open the release pull request"
command = "node scripts/release.ts pr"
dry_run_command = "node scripts/release.ts pr --dry-run"

# Runs in .github/workflows/release.yml once a release pull request is merged.
[cli.publish]
help_text = "In the release workflow: tag the merged release commit, deploy Convex and Netlify when the site was released, and publish released npm packages"

[[cli.publish.steps]]
type = "Command"
name = "check this is the release workflow"
command = "node scripts/release.ts ci"
dry_run_command = "node scripts/release.ts ci --dry-run"

[[cli.publish.steps]]
type = "TagRelease"
name = "tag release"
inputs = { from = "HEAD", push = true }

[[cli.publish.steps]]
type = "Command"
name = "deploy the site"
command = "node scripts/release.ts deploy --if-released"
dry_run_command = "node scripts/release.ts deploy --if-released --dry-run"

# After the deploy, so a failed deploy publishes nothing. Packages this release
# didn't bump are skipped.
[[cli.publish.steps]]
type = "PublishPackages"
name = "publish to npm"
