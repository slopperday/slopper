# Publishes a merged release pull request.
#
# Releases start on a laptop: `vp exec monochange run release` commits the
# release on chore/release, the pre-push hook runs CI, and it opens a pull
# request. .github/workflows/release-merge.yml merges that once its required
# check reports, then dispatches this workflow on main: a merge made with the
# workflow's GITHUB_TOKEN starts no push run. Merging a release pull request by
# hand arrives through the push trigger below instead.
#
# This job tags the release, deploys Convex and Netlify when the site is in it,
# and publishes the released npm packages with npm trusted publishing (OIDC, no
# npm token).
#
# Every other push to main skips this publishing job. CI defaults to the local
# pre-push hook; authorized security repairs opt into ci.yml. Run this workflow
# by hand on chore/release with "dry run" to
# rehearse a release before merging. To retry a publish, run it on main without
# "dry run", naming the release commit when it's no longer the newest one.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: tag, deploy and publish nothing"
        type: boolean
        default: true
      commit:
        description: "Release commit to publish (a retry, once newer commits are on main). Empty: the commit this runs on."
        type: string
        default: ""
      npm_only:
        description: "Only publish the npm packages: the release is tagged and the site already serves it"
        type: boolean
        default: false

concurrency:
  group: release
  # Never cancel a publish halfway: a half-published release is worse than a queued one.
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push the release tags
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "24"
          cache: true

      - run: vp install --frozen-lockfile

      - name: Publish
        run: vp exec monochange ${{ inputs.npm_only && 'publish packages' || 'run publish' }} ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          # The pre-push hook ran CI before the release commit reached GitHub. Here it would run again, without the
          # Convex backend its journeys need, and stop the tag push, so no hooks.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: /dev/null
          # The tagger on the release tags.
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
