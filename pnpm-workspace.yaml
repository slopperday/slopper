# The site is the root package; the CLI and its skill publish to npm (monochange.toml).
packages:
  - packages/*
minimumReleaseAgeExclude:
  - marked@18.1.0
  - vite@8.3.3
  - netlify-cli@27.12.0
  - "@monosecret/cli-darwin-arm64@0.4.2"
  - "@monosecret/cli-darwin-x64@0.4.2"
  - "@monosecret/cli-linux-arm64-gnu@0.4.2"
  - "@monosecret/cli-linux-arm64-musl@0.4.2"
  - "@monosecret/cli-linux-x64-gnu@0.4.2"
  - "@monosecret/cli-linux-x64-musl@0.4.2"
  - "@monosecret/cli-win32-arm64-msvc@0.4.2"
  - "@monosecret/cli-win32-x64-msvc@0.4.2"
  - "@monosecret/cli@0.4.2"
  - "@monochange/cli-darwin-arm64@0.21.0"
  - "@monochange/cli-darwin-x64@0.21.0"
  - "@monochange/cli-linux-arm64-gnu@0.21.0"
  - "@monochange/cli-linux-arm64-musl@0.21.0"
  - "@monochange/cli-linux-x64-gnu@0.21.0"
  - "@monochange/cli-linux-x64-musl@0.21.0"
  - "@monochange/cli-win32-arm64-msvc@0.21.0"
  - "@monochange/cli-win32-x64-msvc@0.21.0"
  - "@monochange/cli@0.21.0"
  - "@canvist/react@0.2.0"
  - "@canvist/web@0.2.0"
overrides:
  vite@*: "catalog:"
  # satori pulls fflate through an opentype beta; the font bytes are our own, but patched is patched.
  "fflate@<0.7.5": "0.7.5"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  # netlify-cli works without its optional native builds (local image CDN, syslog).
  netlify-cli: false
  sharp: false
  unix-dgram: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
