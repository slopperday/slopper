# The production environment of the Netlify site, slopper.day. `vp run env:netlify`
# resolves it and sets every variable on Netlify; nothing here is read at runtime.
# The first read in a day goes to 1Password; the rest come from the local cache.
#
# Secrets live in one 1Password item, "Slopper" in the Development vault, as
# fields of its "production" section named after each variable. The service
# account token that reads it stays in .env.monosecret (gitignored):
#
#   OP_SERVICE_ACCOUNT_TOKEN=ops_...
#
# Values that aren't secret (URLs, OAuth client ids, the bucket, the VAPID
# public key) are defaults below, so they're reviewed like code.

[project]
name = "slopper"
revision = "1.0"

[providers]
bootstrap = "dotenv:.env.monosecret"
# Plaintext copy of what 1Password returned, on this machine only (gitignored).
# Fresh entries never touch the shared service account's quota. After changing
# a value in 1Password: `vp exec monosecret cache clear`.
cache = "dotenv:.env.monosecret.cache"

[providers.onepassword]
uri = "op+token://Development/Slopper"
credentials = { service_account_token = { provider = "bootstrap", ref = { item = "OP_SERVICE_ACCOUNT_TOKEN" } } }
cache = { provider = "cache", max_age = "24h" }

[profiles.default.defaults]
providers = [{ provider = "onepassword", path = ["production"] }]
required = true

# Plain configuration.
[profiles.default.APP_URL]
description = "Public origin for OAuth redirects and absolute links"
default = "https://slopper.day"

[profiles.default.SLOPPER_JWT_ISSUER]
description = "Issuer of the JWTs Convex trusts (convex/auth.config.ts)"
default = "https://slopper.day"

[profiles.default.CONVEX_URL]
description = "The production Convex deployment"
default = "https://cheerful-goshawk-318.convex.cloud"

[profiles.default.ADMIN_USERNAMES]
description = "Lower-case usernames allowed to moderate, comma separated"
default = "ifiokjr"

[profiles.default.VAPID_PUBLIC_KEY]
description = "Public half of the browser notification keys; the private half is on Convex"
default = "BLE3-zz32R-5mXjWCIC_gN6cFAbIt1lL1HREBh_G3D6TlYG-tF_lN5hA4pBTBKgGcj_0d4_MGPU-NajidyWF6ds"

[profiles.default.B2_ENDPOINT]
description = "The screenshot bucket's S3 endpoint"
default = "https://s3.us-west-002.backblazeb2.com"

[profiles.default.B2_REGION]
description = "The screenshot bucket's region"
default = "us-west-002"

[profiles.default.B2_BUCKET]
description = "The screenshot bucket"
default = "slopper-media"

[profiles.default.GITHUB_CLIENT_ID]
description = "GitHub OAuth app"
default = "Ov23lixvARmvPCoZDM2L"

[profiles.default.GOOGLE_CLIENT_ID]
description = "Google OAuth client"
default = "932713108543-u1iuh15pmpcngtt3ramt86blf82950gm.apps.googleusercontent.com"

[profiles.default.FACEBOOK_CLIENT_ID]
description = "Facebook Login app id"
default = "1873069064138081"

[profiles.default.LINKEDIN_CLIENT_ID]
description = "LinkedIn app"
default = "78u74l6x0fehqm"

# Secrets, from the 1Password item.
[profiles.default.SLOPPER_JWT_PRIVATE_KEY]
description = "Signs the JWTs Convex trusts (scripts/convex-keys.ts)"

[profiles.default.SLOPPER_SECRET_KEY]
description = "Encrypts connected social accounts' tokens; changing it disconnects them all"

[profiles.default.B2_KEY_ID]
description = "keyID of the bucket's application key"

[profiles.default.B2_APPLICATION_KEY]
description = "applicationKey of the bucket's application key"

[profiles.default.GITHUB_CLIENT_SECRET]
description = "GitHub OAuth app"

[profiles.default.GOOGLE_CLIENT_SECRET]
description = "Google OAuth client"

[profiles.default.FACEBOOK_CLIENT_SECRET]
description = "Facebook Login app secret"

[profiles.default.LINKEDIN_CLIENT_SECRET]
description = "LinkedIn app"

# Not set yet. The content check needs OPENROUTER_API_KEY: without it nothing is
# ever auto-posted. X needs both of its keys to sign people in and post.
[profiles.default.OPENROUTER_API_KEY]
description = "The content check, through OpenRouter"
required = false

[profiles.default.X_CLIENT_ID]
description = "X OAuth app"
required = false

[profiles.default.X_CLIENT_SECRET]
description = "X OAuth app"
required = false

# Deploying, not running: only scripts/release.ts reads this profile, so the
# deploy key never reaches Netlify. It picks the production deployment
# whatever a checkout's .env.local selects. Field of the item's "deploy" section.
[profiles.deploy.defaults]
inherit = false
providers = [{ provider = "onepassword", path = ["deploy"] }]
required = true

[profiles.deploy.CONVEX_DEPLOY_KEY]
description = "Convex production deploy key (dashboard → Settings → Deploy keys)"
